name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_BRANCH: master

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the app builds without a live database.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy over SSH (PM2)
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP: ${{ secrets.PM2_APP || 'bsplms' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass >/dev/null

          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' DEPLOY_BRANCH='$DEPLOY_BRANCH' PM2_APP='$PM2_APP' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "Node.js/npm not found on PATH for $SSH_USER." >&2
            exit 1
          fi
          if ! node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>20||(a===20&&b>=9)?0:1)'; then
            echo "Node $(node -v) is too old; this app needs Node 20.9+." >&2
            exit 1
          fi
          if ! command -v pm2 >/dev/null; then
            echo "pm2 not found on PATH; install it with 'npm i -g pm2'." >&2
            exit 1
          fi

          if [ ! -d .git ]; then
            if [ -z "$(ls -A .)" ]; then
              git clone "$REPO_URL" .
            else
              echo "$DEPLOY_PATH is not a git checkout and is not empty. Point DEPLOY_PATH at the app's checkout." >&2
              exit 1
            fi
          fi

          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env - copy .env.example and set DATABASE_URL." >&2
            exit 1
          fi

          # The Laravel app's .env survives `git reset --hard` but only has
          # DB_* keys. Derive DATABASE_URL from them once so both drizzle-kit
          # and the running app can reach the same MySQL database.
          if ! grep -qE '^DATABASE_URL=' .env; then
            if ! grep -qE '^DB_CONNECTION=mysql' .env; then
              echo "No DATABASE_URL in .env and DB_CONNECTION is not mysql; set DATABASE_URL=mysql://USER:PASSWORD@HOST:PORT/DB." >&2
              exit 1
            fi
            DB_URL="$(node -e 'const fs=require("fs");const e={};for(const l of fs.readFileSync(".env","utf8").split(/\r?\n/)){const m=l.match(/^([A-Z0-9_]+)=(.*)$/);if(m)e[m[1]]=m[2].replace(/^["\x27]|["\x27]$/g,"");}if(e.DB_CONNECTION!=="mysql")process.exit(1);const u=encodeURIComponent(e.DB_USERNAME||"root");const p=encodeURIComponent(e.DB_PASSWORD||"");process.stdout.write("mysql://"+u+(p?":"+p:"")+"@"+(e.DB_HOST||"127.0.0.1")+":"+(e.DB_PORT||"3306")+"/"+(e.DB_DATABASE||"bsp_lms"));')"
            printf '\nDATABASE_URL="%s"\n' "$DB_URL" >> .env
            echo "Derived DATABASE_URL from the existing DB_* settings."
          fi
          if ! grep -qE '^DATABASE_URL="?mysql://' .env; then
            echo "DATABASE_URL in .env is not a MySQL URL." >&2
            exit 1
          fi

          # ponytail: reset --hard discards server-side edits; untracked files
          # (.env, uploads) survive. Switch to release dirs if hotfixes must persist.
          git fetch --prune "$REPO_URL" "+refs/heads/$DEPLOY_BRANCH:refs/remotes/deploy/$DEPLOY_BRANCH"
          git reset --hard "refs/remotes/deploy/$DEPLOY_BRANCH"

          npm ci --include=dev --no-audit --no-fund
          npm run build

          # bsp's DB already has this schema from the Laravel port; baseline
          # drizzle's history once so migrate does not re-create its tables.
          node scripts/baseline-migrations.mjs
          npm run db:migrate

          # ecosystem.config.cjs reads PORT/PM2_INSTANCES from .env.
          # startOrReload keeps the old worker count, so restart cleanly to
          # apply instance changes (e.g. scaling "max" down to 1).
          pm2 delete "$PM2_APP" >/dev/null 2>&1 || true
          pm2 start ecosystem.config.cjs --update-env
          pm2 save || true

          APP_PORT="$(sed -n 's/^PORT=//p' .env | tail -n 1 | tr -d '\"')"
          APP_PORT="${APP_PORT:-3000}"
          echo "Health checking on 127.0.0.1:${APP_PORT}"

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed; recent logs:" >&2
          pm2 logs "$PM2_APP" --lines 40 --nostream || true
          exit 1
          REMOTE
