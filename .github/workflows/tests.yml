name: tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the older run pointless; cancel it rather
# than burn a runner on stale code.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # --no-scripts first, then re-run the package:discover hook once .env and
      # the key exist: post-autoload-dump boots the framework, which fails on a
      # missing APP_KEY.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite
          composer run-script post-autoload-dump --no-interaction

      - name: Install and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check code style
        run: vendor/bin/pint --test --parallel

      # Tests run on in-memory SQLite (see phpunit.xml), so no database service
      # is needed and no state leaks between runs.
      - name: Run tests
        run: php artisan test --colors=always
